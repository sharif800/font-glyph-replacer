version: '3.8'

services:
  font-replacer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: font-replacer-app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-super-secret-jwt-key-change-this-in-production-12345}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password123}
    volumes:
      - tmp_data:/tmp/font_replacer_uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  tmp_data:
